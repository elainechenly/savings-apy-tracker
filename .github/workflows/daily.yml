name: daily-apy

on:
  schedule:
    - cron: "37 16 * * *"      # 16:37 UTC = 9:37 Pacific (8:37 in winter); an off-peak minute
  workflow_dispatch:           # adds a manual "Run workflow" button

concurrency:
  group: daily-apy
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write          # lets the job commit rates.csv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Collect rates and build the dashboard
        run: python main.py --debug      # fails only if ALL banks fail

      - name: Save debug files (page text and screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit the updated CSV
        if: always()
        run: |
          git config user.name "apy-bot"
          git config user.email "apy-bot@users.noreply.github.com"
          git add data/rates.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "rates $(date -u +%F)"
            git push
          fi

      - name: Package the dashboard for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: collect             # skipped automatically if the collect job failed
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
